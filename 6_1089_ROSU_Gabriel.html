<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor SVG</title>
    <link rel="stylesheet" href="6_1089_ROSU_Gabriel.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body>
    <div id="tool-bar">
        <button class="tool" id="undo-btn"><i class="bi bi-arrow-return-left" title="Undo"></i></button>
        <button class="tool" id="choose-shape-btn">
            <i class="bi bi-diamond" title="choose shape" style="position: relative"></i>
            <div id="shape-selector" class="popup-menu hidden">
                <div class="shape-option" data-shape="Rectangle" title="Rectangle"><i class="bi bi-square"></i></div>
                <div class="shape-option" data-shape="Elipse" title="Elipse"><i class="bi bi-circle"></i></div>
                <div class="shape-option" data-shape="Line" title="Line"><i class="bi bi-dash"></i></div>
            </div>
        </button>
        
        <button class="tool" id="draw-path-btn"><i class="bi bi-pen" title="Draw Path"></i></button>
        <button class="tool" id="select-btn"><i class="bi bi-hand-index" title="Select"></i></button>
        <button class="tool" id="export-raster-btn"><i class="bi bi-image" title="Export Raster"></i></button>
        <button class="tool" id="save-as-svg-btn"><i class="bi bi-file-earmark-arrow-down-fill" title="Save as SVG"></i></button>
        
    </div>
    <div id="svg-container">
        <svg id="svg-canvas">Your browser doesn't support SVG</svg>
    </div>

    <script type="module">
        // Imports from the *.js file
        import { SVGEditor } from './6_1089_ROSU_Gabriel.js';
        import { Elipse, Rectangle, Line } from './6_1089_ROSU_Gabriel.js';

        // JavaScript constants for handling DOM elements
        const undoBtn = document.getElementById('undo-btn');
        const chooseShapeBtn = document.getElementById('choose-shape-btn');
        const selectBtn = document.getElementById('select-btn');
        const drawPathBtn = document.getElementById('draw-path-btn');
        const exportRasterBtn = document.getElementById('export-raster-btn');
        const saveAsSvgBtn = document.getElementById('save-as-svg-btn');


        const shapeSelector = document.getElementById('shape-selector');

        
        // Event handlers for a pop-up menu of shapes to be selected by the user
        
        // Toggle the menu
        chooseShapeBtn.addEventListener('click', (e) => {
            // Stop propagation so clicking the button doesn't trigger "close" listeners
            e.stopPropagation(); 
            shapeSelector.classList.toggle('hidden');
        });

        // Select a shape and close menu
        shapeSelector.querySelectorAll('.shape-option').forEach(option => {
            option.addEventListener('click', (e) => {
                let currentSelectedShape = e.currentTarget.dataset.shape;
                console.log("Active tool set to:", currentSelectedShape);
                
                shapeSelector.classList.add('hidden');
            });
        });

        // Close menu if user clicks anywhere else
        document.addEventListener('click', () => {
            shapeSelector.classList.add('hidden');
        });


        const svgEditor = new SVGEditor('svg-canvas');
        svgEditor.addShape(new Elipse(100, 100, 50, 30, "red", 2));
        svgEditor.addShape(new Rectangle(200, 200, 80, 60, "blue", 3));
        svgEditor.addShape(new Line(300, 300, 400, 400, "green", 4));




    </script>

</body>
</html>
