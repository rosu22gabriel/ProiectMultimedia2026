<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor SVG</title>
    <link rel="stylesheet" href="6_1089_ROSU_Gabriel.css"/>
    <!-- Link to Bootstrap's icon library that is used for buttons-->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body>
    <!---------------------------------- MAIN TOOL BAR ------------------------------------------->
    <!-- This div element is the main tool-bar containing buttons for selection of actions, or selection of properties for drawing on the SVG -->
    <div id="tool-bar">
        <button class="tool" id="undo-btn">
            <i class="bi bi-arrow-return-left" title="Undo"></i>
        </button>

        <button class="tool" id="choose-shape-btn">
            <i class="bi bi-diamond" title="Choose Shape" style="position: relative"></i>
        </button>

        <!-- This div element contains a pop-up menu that only appears when the user click on the Choose Shape button -->
        <div id="shape-selector-menu" class="popup-menu hidden">
            <div class="shape-option" data-shape="Rectangle" title="Rectangle"> <i class="bi bi-square"> </i></div>
            <div class="shape-option" data-shape="Elipse"    title="Elipse">    <i class="bi bi-circle"> </i></div>
            <div class="shape-option" data-shape="Line"      title="Line">      <i class="bi bi-dash">   </i></div>
        </div>
        
        <button class="tool" id="draw-path-btn">
            <i class="bi bi-pen" title="Draw Path"></i>
        </button>

        <button class="tool" id="select-btn">
            <i class="bi bi-hand-index" title="Select"></i>
        </button>

        <button class="tool" id="export-raster-btn">
            <i class="bi bi-image" title="Export Raster"></i>
        </button>

        <button class="tool" id="save-as-svg-btn">
            <i class="bi bi-file-earmark-arrow-down-fill" title="Save as SVG"></i>
        </button>

        <!------------------------------- SHAPE PROPERTIES EXTENSION ------------------------------->
        <!--This is an extension of the main tool-bar that only appears when selecting a shape -->
        <div id="shape-properties-tools" class="hidden" style="margin-left: 100px">

            <button class="tool" id="select-stroke-color-btn" title="Select Stroke Color">
                <i class="bi bi-eyedropper" title="Select Stroke Color"></i>
            </button>

            <!--This div element contains a pop-up menu that only appears when the user click on the Select Stroke Color button. -->
            <div id="stroke-color-selector-menu" class="popup-menu hidden"> 
                <div class="stroke-color-option" data-stroke-color="red"    style="background-color: red"></div>
                <div class="stroke-color-option" data-stroke-color="blue"   style="background-color: blue"></div>
                <div class="stroke-color-option" data-stroke-color="green"  style="background-color: green"></div>
                <div class="stroke-color-option" data-stroke-color="black"  style="background-color: black"></div>
            </div>

            <button class="tool" id="select-stroke-width-btn" title="Select Stroke Width">
                <i class="bi bi-border-width" title="Select Stroke Width"></i>
            </button>

            <!--This div element contains a pop-up menu that only appears when the user clicks on the Select Stroke Width button. -->
            <div id="width-selector-menu" class="popup-menu hidden"> 
                <div class="width-option" data-width="1">1px</div>
                <div class="width-option" data-width="2">2px</div>
                <div class="width-option" data-width="4">4px</div>
                <div class="width-option" data-width="8">8px</div>
            </div>
            
            <button class="tool" id="select-fill-color-btn" title="Select Fill Color">
                <i class="bi bi-paint-bucket" title="Select Fill Color"></i>
            </button>

            <!--This div element contains a pop-up menu that only appears when the user clicks on the Select Fill Color button. -->
            <div id="fill-color-selector-menu" class="popup-menu hidden">
                <div class="fill-color-option" data-fill-color="red"    style="background-color: red"></div>
                <div class="fill-color-option" data-fill-color="blue"   style="background-color: blue"></div>
                <div class="fill-color-option" data-fill-color="green"  style="background-color: green"></div>
                <div class="fill-color-option" data-fill-color="black"  style="background-color: black"></div>
            </div>
        </div>
        
    </div>

    <!-- Container for the SVG Canvas. The intention behind this is to have a container that would fill the page's interface. -->
    <!-- Also, taking the example of Google's Google Drawings, this container would also be an SVG HTML element so that the user 
         could add shapes outside of the canvas. But that is not yet implemented here. -->
    <div id="svg-container">
        <svg id="svg-canvas">Your browser doesn't support SVG</svg>
    </div>


    <!------------------------------- TOOL-BAR INTERACTIVITY SCRIPT ELEMENT --------------------------------->
    <!-- This script element contains event handlers for interactivity on the page i.e. interactivity of 
        the selection menus of the interface -->

    <script type="text/javascript">
        // Buttons of the main tool-bar
        const chooseShapeBtn          = document.getElementById('choose-shape-btn');
        const shapeSelectorMenu       = document.getElementById('shape-selector-menu');

        // Main tool-bar's extension of buttons for selection of specific shape properties
        const shapePropertiesTools    = document.getElementById('shape-properties-tools');
        
        // Buttons of the main tool-bar's extension
        const selectStrokeColorBtn    = document.getElementById('select-stroke-color-btn');
        const selectStrokeWidthBtn    = document.getElementById('select-stroke-width-btn');
        const selectFillColorBtn      = document.getElementById('select-fill-color-btn');

        // Pop-up menus for selection of specific shape properties
        const fillColorSelectorMenu   = document.getElementById('fill-color-selector-menu');
        const strokeColorSelectorMenu = document.getElementById('stroke-color-selector-menu');
        const widthSelectorMenu       = document.getElementById('width-selector-menu');

        // Null initiated variables for the user's choices to be later filled and applied to shapes;
        let currentSelectedShape       = null;
        let currentSelectedStrokeWidth = null;
        let currentSelectedFillColor   = null;
        let currentSelectedStrokeColor = null;
        

        // ================================== SHAPE SELECTION LOGIC ================================ \\

        // Toggle the shape selection menu
        chooseShapeBtn.addEventListener('click', (e) => {
            // .stopPropagation() prevents the menu from immediate closing.
            e.stopPropagation(); 

            // classList.toggle('hidden') toggles the 'hidden' class to show the shape selector menu
            shapeSelectorMenu.classList.toggle('hidden'); 
        });

        // Select a shape and close menu
        shapeSelectorMenu.querySelectorAll('.shape-option').forEach(option => {
            option.addEventListener('click', (e) => {
                // When a shape is selected, an extension of the toolbar appears with options for setting shape properties
                shapePropertiesTools.classList.toggle('hidden');

                currentSelectedShape = e.currentTarget.dataset.shape;
                console.log("Active shape set to:", currentSelectedShape);
                
                shapeSelectorMenu.classList.toggle('hidden');
            });
        });
        
        // Close shape selection menu if user clicks anywhere else
        document.addEventListener('click', () => {
            // classList.toggle('hidden') toggles the 'hidden' class to hide the shape selector menu
            shapeSelectorMenu.classList.add('hidden');
        });


        // ===================================== WIDTH SELECTION LOGIC =============================== \\

        // Toggle the stroke width selection menu
        selectStrokeWidthBtn.addEventListener('click', (e) => {
            //.stopPropagation() prevents the menu from immediate closing.
            e.stopPropagation();

            // classList.toggle('hidden') toggles the 'hidden' class to show the shape selector menu
            widthSelectorMenu.classList.toggle('hidden');
        });

        // Select a stroke width option then close the menu
        widthSelectorMenu.querySelectorAll('.width-option').forEach(option => {
            option.addEventListener('click', (e) => {
                currentSelectedStrokeWidth = e.currentTarget.dataset.width;
                console.log("Active width option set to:", `${currentSelectedStrokeWidth}px`);
                
                // classList.toggle('hidden') toggles the 'hidden' class to hide the width selector menu
                widthSelectorMenu.classList.toggle('hidden');
            })
        })
        
        // Close stroke width selection menu if user clicks anywhere else
        document.addEventListener('click', () => {
            widthSelectorMenu.classList.add('hidden');
        });


        // ==================================== FILL COLOR SELECTION LOGIC ================================ \\

        // Toggle the fill color selection menu
        selectFillColorBtn.addEventListener('click', (e) => {
            //.stopPropagation() prevents the menu from immediate closing.
            e.stopPropagation();
            fillColorSelectorMenu.classList.toggle('hidden');
        });

        fillColorSelectorMenu.querySelectorAll('.fill-color-option').forEach(option => {
            option.addEventListener('click', (e) => {
                currentSelectedFillColor = e.currentTarget.dataset.fillColor;
                console.log("Active fill color option set to:", currentSelectedFillColor);

                fillColorSelectorMenu.classList.toggle('hidden');
            })
        })

        // Close fill color selection menu if user clicks anywhere else
        document.addEventListener('click', () => {
            fillColorSelectorMenu.classList.add('hidden');
        });


        // ==================================== STROKE COLOR SELECTION LOGIC ============================== \\

        // Toggle the stroke color selection menu
        selectStrokeColorBtn.addEventListener('click', (e) => {
            //.stopPropagation() prevents the menu from immediate closing.
            e.stopPropagation();
            strokeColorSelectorMenu.classList.toggle('hidden');
        });

        strokeColorSelectorMenu.querySelectorAll('.stroke-color-option').forEach(option => {
            option.addEventListener('click', (e) => {
                currentSelectedStrokeColor = e.currentTarget.dataset.strokeColor;
                console.log("Active stroke color option set to:", currentSelectedStrokeColor);

                strokeColorSelectorMenu.classList.toggle('hidden');
            });
        });

        // Close stroke color selection menu if user clicks anywhere else
        document.addEventListener('click', () => {
            strokeColorSelectorMenu.classList.add('hidden');
        });

    </script>


    <!---------------------------- SVG-EDITOR LOGIC --------------------------------------->
    <!-- This script element contains SVGEditor manipulation logic-->
    <script type="module">

        // Import editor and shape classes
        import { SVGEditor, Elipse, Rectangle, Line } from './6_1089_ROSU_Gabriel.js';

        // Buttons from the main tool-bar
        const undoBtn         = document.getElementById('undo-btn');
        const selectBtn       = document.getElementById('select-btn');
        const drawPathBtn     = document.getElementById('draw-path-btn');
        const exportRasterBtn = document.getElementById('export-raster-btn');
        const saveAsSvgBtn    = document.getElementById('save-as-svg-btn');

        // Simple Save as SVG: serialize current SVG and download
        saveAsSvgBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            const svg = svgEditor.svgCanvas;
            const serializer = new XMLSerializer();
            const svgString = '<?xml version="1.0" encoding="UTF-8"?>\n' + serializer.serializeToString(svg);
            const blob = new Blob([svgString], { type: 'image/svg+xml;charset=utf-8' });
            const url = URL.createObjectURL(blob);

            const a = document.createElement('a');
            a.href = url;
            a.download = 'drawing.svg';
            document.body.appendChild(a);
            a.click();
            a.remove();

            URL.revokeObjectURL(url);
        });

        // Create the SVG editor instance
        const svgEditor = new SVGEditor('svg-canvas');

        // ====================================== SELECTION, DRAG & PROPERTY LOGIC ======================================= \\

        // 'Select mode' allows the user to click shapes to select them and drag to move them.

        // Make selectMode available to the drop handler so drawing can be disabled in select mode
        let selectMode = false;
        let isDragging = false;
        let draggedShape = null;
        const dragOffset = { x: 0, y: 0 };

        // Small flag to avoid deselecting immediately on the same click that places a shape
        let justPlacedShape = false;

        // Toggle select mode when the Select button is clicked
        selectBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            selectMode = !selectMode;
            selectBtn.classList.toggle('active', selectMode);

            svgEditor.svgCanvas.style.cursor = selectMode ? 'default' : '';

            if (!selectMode) {
                // Exiting select mode: deselect any selection and hide properties
                svgEditor.deselectShape();
                shapePropertiesTools.classList.add('hidden');
            }
        });


        // =========================== LOGIC FOR DROPPING SHAPES ON THE CANVAS =================================== \\
        
        // If we're in select mode, we should not place shapes by clicking the canvas
        svgEditor.svgCanvas.addEventListener('click', (e) => {
            if (selectMode) return; // disable drawing while selecting

            // Element.getBoundingClientRect() gives the position of the SVG canvas relative to the viewport
            // We need this to calculate the mouse position within the SVG canvas
            const rect = svgEditor.svgCanvas.getBoundingClientRect();

            // Calculate mouse position within the SVG canvas
            // e.clientX and e.clientY give the mouse position relative to the viewport
            // Subtract the SVG canvas position to get the position within the SVG canvas
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            if (currentSelectedShape === 'Rectangle') {
                // Subtract half of width and height from x, y so that shape is placed with the cursor in the middle of it
                const newRect = new Rectangle(x - 40, y - 30, 80, 60, currentSelectedStrokeColor || 'black', currentSelectedFillColor || 'transparent', currentSelectedStrokeWidth || 1);
                svgEditor.addShape(newRect);
                justPlacedShape = true;
                setTimeout(() => justPlacedShape = false, 0);
            } else if (currentSelectedShape === 'Elipse') {
                const newElipse = new Elipse(x, y, 50, 30, currentSelectedStrokeColor || 'black', currentSelectedFillColor || 'transparent', currentSelectedStrokeWidth || 1);
                svgEditor.addShape(newElipse);
                justPlacedShape = true;
                setTimeout(() => justPlacedShape = false, 0);
            } else if (currentSelectedShape === 'Line') {
                const newLine = new Line(x - 50, y - 50, x + 50, y + 50, currentSelectedStrokeColor || 'black', currentSelectedFillColor || 'transparent', currentSelectedStrokeWidth || 1);
                svgEditor.addShape(newLine);
                justPlacedShape = true;
                setTimeout(() => justPlacedShape = false, 0);
            }
        });

        // Deselect when clicking empty space (ignore immediate post-placement click)
        document.addEventListener('click', (e) => {
            if (justPlacedShape) return; // ignore the immediate post-placement click

            // keep selection if clicking a shape
            if (e.target.shapeObject) return;

            // ignore clicks on the toolbar or menus
            if (e.target.closest && (e.target.closest('#tool-bar') || e.target.closest('.popup-menu'))) return;

            svgEditor.deselectShape();
            shapePropertiesTools.classList.add('hidden');
        });

        // Helper to update UI-side variables from a shape's properties
        // function updateShapePropertiesUI(shape) {
        //     if (!shape) return;
        //     currentSelectedStrokeColor = shape.color;
        //     currentSelectedFillColor = shape.fillColor;
        //     currentSelectedStrokeWidth = shape.strokeWidth;
        // }

        // ================================== LOGIC FOR MOVING A SHAPE AFTER SELECTION ============================== \\

        // Start selection/dragging on mousedown
        svgEditor.svgCanvas.addEventListener('mousedown', (e) => {
            if (!selectMode) return;

            const targetShape = e.target.shapeObject;
            const rect = svgEditor.svgCanvas.getBoundingClientRect();

            if (targetShape) {
                e.stopPropagation();
                svgEditor.selectShape(targetShape);
                shapePropertiesTools.classList.remove('hidden');
                // updateShapePropertiesUI(targetShape);

                isDragging = true;
                draggedShape = targetShape;

                dragOffset.x = e.clientX - rect.left - draggedShape.x;
                dragOffset.y = e.clientY - rect.top - draggedShape.y;
            } else {
                // clicked an empty area -> deselect
                svgEditor.deselectShape();
                shapePropertiesTools.classList.add('hidden');
            }
        });

        // Dragging: move the shape while mouse moves
        window.addEventListener('mousemove', (e) => {
            if (!isDragging || !draggedShape) return;
            const rect = svgEditor.svgCanvas.getBoundingClientRect();
            const newX = e.clientX - rect.left - dragOffset.x;
            const newY = e.clientY - rect.top - dragOffset.y;
            svgEditor.moveShape(draggedShape, newX, newY);
        });

        // End dragging
        window.addEventListener('mouseup', () => {
            isDragging = false;
            draggedShape = null;
        });
        
        // ============================== LOGIC FOR CHANGING PROPERTIES OF A SELECTED SHAPE ========================= \\

        // Apply UI selections to the active shape
        function applyToSelected() {
            const s = svgEditor.getSelectedShape();
            if (!s) return;
            if (currentSelectedStrokeColor) s.color = currentSelectedStrokeColor;
            if (currentSelectedFillColor) s.fillColor = currentSelectedFillColor;
            if (currentSelectedStrokeWidth !== null) s.strokeWidth = Number(currentSelectedStrokeWidth);
        }

        // Re-hook the option buttons (they already update the currentSelected* variables) to also apply changes to the selected shape
        document.querySelectorAll('#width-selector-menu .width-option').forEach(option => {
            option.addEventListener('click', () => applyToSelected());
        });
        document.querySelectorAll('#fill-color-selector-menu .fill-color-option').forEach(option => {
            option.addEventListener('click', () => applyToSelected());
        });
        document.querySelectorAll('#stroke-color-selector-menu .stroke-color-option').forEach(option => {
            option.addEventListener('click', () => applyToSelected());
        });



        // ================================ LOGIC FOR DELETING SHAPES OFF THE CANVAS ================================ \\
        // Delete selected shape with Backspace or Delete key 
        document.addEventListener('keydown', (e) => {
            if (e.key !== 'Backspace' && e.key !== 'Delete') return;

            // Only act if a shape is currently selected
            const selected = svgEditor.getSelectedShape();
            if (!selected) return;

            // Prevent default browser behavior (e.g., navigating back)
            e.preventDefault();

            svgEditor.deleteShape();
            shapePropertiesTools.classList.add('hidden');
        });

        // ======================================== SAVING AS SVG LOGIC ============================================= \\
        
        // Simple Save as SVG: serialize current SVG and download
        saveAsSvgBtn.addEventListener('click', (e) => {
            // avoid closing menus by stopping the event
            e.stopPropagation();

            // get the SVG we want to save
            const svg = svgEditor.svgCanvas;

            // convert the SVG DOM to an XML string
            const serializer = new XMLSerializer();

            // add XML header and serialize to a single string
            const svgString = '<?xml version="1.0" encoding="UTF-8"?>\n' + serializer.serializeToString(svg);

            // make a downloadable file from the SVG text
            const blob = new Blob([svgString], { type: 'image/svg+xml;charset=utf-8' });

            // create a temporary URL for the file
            const url = URL.createObjectURL(blob);

            // create and click a hidden link to trigger the download
            const a = document.createElement('a');
            a.href = url;
            a.download = 'drawing.svg';
            document.body.appendChild(a);
            a.click();
            a.remove();

            // free the temporary URL
            URL.revokeObjectURL(url);
        });
    </script>

</body>
</html>
